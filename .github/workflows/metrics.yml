name: Metrics

on:
  schedule:
    - cron: "0 8 * * *"      # daily, 08:00 UTC (03:00 CDT)
  workflow_dispatch:          # manual trigger from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write             # required for the action to commit the SVG back

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: rekzdev
          filename: metrics.languages.svg
          base: ""            # no header/activity blocks, languages panel only

          # ---- account / repo scope ----
          # all 20 repos are org-owned, so organization_member is mandatory
          repositories_affiliations: owner, collaborator, organization_member

          # ---- commit attribution ----
          # only consumed by recently-used / indepth modes; harmless otherwise.
          # replace with the exact strings from the events-feed check.
          commits_authoring: >-
            rekzdev,
            rekz,
            michael@rekz.dev,
            contactme@rekz.dev,
            228596557+rekzdev@users.noreply.github.com

          # ---- languages plugin ----
          plugin_languages: yes
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_other: yes
          plugin_languages_ignored: >-
            html, css, dockerfile, makefile, shell, tex, less, cmake

          # ---- troubleshooting ----
          # debug: yes
